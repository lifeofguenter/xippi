name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The xcode-27 image defaults to Xcode 27.1; the project needs 27.2 (Swift 6.4, macOS 27 SDK).
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
  test:
    name: lint · test · coverage
    runs-on: xcode-27
    # A hung test fails the run here instead of holding the runner for GitHub's six hours.
    timeout-minutes: 30
    env:
      # Swift Testing runs at most 4 tests at a time. Unbounded, it starts a package's whole
      # suite at once, and on the runner's 3 cores the tests' timing assumptions stop holding.
      SWT_EXPERIMENTAL_MAXIMUM_PARALLELIZATION_WIDTH: "4"
      # A package's tests are stopped after 5 minutes (scripts/cover.sh), well inside the job's.
      TEST_TIME_LIMIT: "300"
    permissions:
      contents: read
      # Upload to GitHub's code coverage (part of GitHub Code Quality).
      code-quality: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Coverage belongs to the pull request's head commit, not the merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/cache@v6
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ hashFiles('Packages/*/Package.swift', 'Packages/*/Package.resolved') }}
          restore-keys: swiftpm-

      - name: Lint
        run: make lint

      # Unit tests of every package with coverage, run even when lint failed so one run shows
      # both. Every package runs even after one fails. The integration tests need the Docker
      # test servers, which macOS runners do not have; they skip themselves without
      # XIPPI_INTEGRATION.
      - name: Test + coverage
        if: ${{ !cancelled() }}
        run: make cover

      - name: Test summary
        if: ${{ !cancelled() }}
        run: make -s test-summary >> "$GITHUB_STEP_SUMMARY"

      # Console logs, and for a package stopped at its time limit, what its tests waited on.
      - name: Keep test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/

      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('coverage/coverage.json') != '' }}
        run: node scripts/coverage-summary.mjs coverage/coverage.json >> "$GITHUB_STEP_SUMMARY"

      # GitHub's own coverage: the pull request comment and the per-file view compare against
      # the last upload from main, so both pull requests and pushes to main upload, and only
      # from a green run, so a package that failed to build does not show as lost coverage.
      # Not from forks (no write token) and not for tags. Needs GitHub Code Quality enabled
      # for the repository; until it is, the upload fails without failing the run.
      - name: Upload coverage to GitHub
        if: >-
          ${{ !startsWith(github.ref, 'refs/tags/') &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: true
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage/coverage.xml
          language: Swift
          label: code-coverage/swift-test

  build:
    name: build app (Debug, Release, UI tests)
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      # No signing team on the runner: build unsigned.
      XCODEBUILD_FLAGS: >-
        CODE_SIGNING_ALLOWED=NO
        -skipMacroValidation
        -skipPackagePluginValidation
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ hashFiles('Packages/*/Package.swift', 'Packages/*/Package.resolved') }}
          restore-keys: swiftpm-

      - name: Build (Debug)
        run: make build CONFIGURATION=Debug

      - name: Build (Release)
        run: make build CONFIGURATION=Release

      - name: Build UI tests
        run: make build-tests CONFIGURATION=Debug
