name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The xcode-27 image defaults to Xcode 27.1; the project needs 27.2 (Swift 6.4, macOS 27 SDK).
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
  test:
    name: lint · test · coverage
    runs-on: xcode-27
    # A hung test fails the run here instead of holding the runner for GitHub's six hours.
    timeout-minutes: 30
    env:
      # Swift Testing runs at most 4 tests at a time. Unbounded, it starts a package's whole
      # suite at once, and on the runner's 3 cores the tests' timing assumptions stop holding.
      SWT_EXPERIMENTAL_MAXIMUM_PARALLELIZATION_WIDTH: "4"
      # A package's tests are stopped after 5 minutes (scripts/cover.sh), well inside the job's.
      TEST_TIME_LIMIT: "300"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ hashFiles('Packages/*/Package.swift', 'Packages/*/Package.resolved') }}
          restore-keys: swiftpm-

      - name: Lint
        run: make lint

      # The release tag's logic and the App Store text check.
      - name: Script tests
        if: ${{ !cancelled() }}
        run: make test-scripts

      # Unit tests of every package with coverage, run even when lint failed so one run shows
      # both. Every package runs even after one fails. The integration tests need the Docker
      # test servers, which macOS runners do not have; they skip themselves without
      # XIPPI_INTEGRATION.
      - name: Test + coverage
        if: ${{ !cancelled() }}
        run: make cover

      - name: Test summary
        if: ${{ !cancelled() }}
        run: make -s test-summary >> "$GITHUB_STEP_SUMMARY"

      # Console logs, and for a package stopped at its time limit, what its tests waited on.
      - name: Keep test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/

      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('coverage/coverage.json') != '' }}
        run: node scripts/coverage-summary.mjs coverage/coverage.json >> "$GITHUB_STEP_SUMMARY"

      # Coveralls hosts the coverage history and comments on pull requests. Runs even when tests
      # failed, so a coverage drop is still visible.
      - name: Upload coverage to Coveralls
        if: always()
        uses: coverallsapp/github-action@v2
        with:
          file: coverage/lcov.info
          format: lcov

  build:
    name: build app (Debug, Release, UI tests)
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      # No signing team on the runner: build unsigned.
      XCODEBUILD_FLAGS: >-
        CODE_SIGNING_ALLOWED=NO
        -skipMacroValidation
        -skipPackagePluginValidation
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ hashFiles('Packages/*/Package.swift', 'Packages/*/Package.resolved') }}
          restore-keys: swiftpm-

      - name: Build (Debug)
        run: make build CONFIGURATION=Debug

      - name: Build (Release)
        run: make build CONFIGURATION=Release

      - name: Build UI tests
        run: make build-tests CONFIGURATION=Debug

      - name: App unit tests
        run: make test-app CONFIGURATION=Debug

      # The result bundle, with the window captures the look tests attach.
      - name: Keep test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: app-test-results
          path: test-results/

  # A v* tag: build, sign and upload to TestFlight; a plain tag also goes to App Review and
  # is released once approved (fastlane/Fastfile). Its secrets are in the environment
  # app-store, which only v* tags may use.
  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: xcode-27
    timeout-minutes: 60
    environment: app-store
    steps:
      - uses: actions/checkout@v7
        with:
          # Every tag, for the previous release's notes, and main, for the check.
          fetch-depth: 0

      - uses: actions/cache@v6
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ hashFiles('Packages/*/Package.swift', 'Packages/*/Package.resolved') }}
          restore-keys: swiftpm-

      # The Ruby in .ruby-version, and the gems in Gemfile.lock, cached.
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Release
        run: make release
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          INSTALLER_CERT_P12: ${{ secrets.INSTALLER_CERT_P12 }}
          INSTALLER_CERT_PASSWORD: ${{ secrets.INSTALLER_CERT_PASSWORD }}
          MAS_PROFILE: ${{ secrets.MAS_PROFILE }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REVIEW_FIRST_NAME: ${{ secrets.REVIEW_FIRST_NAME }}
          REVIEW_LAST_NAME: ${{ secrets.REVIEW_LAST_NAME }}
          REVIEW_PHONE: ${{ secrets.REVIEW_PHONE }}
          REVIEW_DEMO_USER: ${{ secrets.REVIEW_DEMO_USER }}
          REVIEW_DEMO_PASSWORD: ${{ secrets.REVIEW_DEMO_PASSWORD }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_OPT_OUT_USAGE: "1"
