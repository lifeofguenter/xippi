name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: swift
            runs-on: xcode-27
            build-mode: manual
          - language: python
            runs-on: ubuntu-latest
            build-mode: none
    env:
      # The xcode-27 image defaults to Xcode 27.1; the project needs 27.2. Unused on Linux.
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      # The app and every package it uses, unsigned, as the ci workflow builds it.
      - name: Build
        if: matrix.language == 'swift'
        run: >-
          make build
          XCODEBUILD_FLAGS="CODE_SIGNING_ALLOWED=NO -skipMacroValidation -skipPackagePluginValidation"

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
